<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="zapreach_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="100%" stop-color="#061610"/>
    </linearGradient>
    <linearGradient id="zapreach_bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="zapreach_wave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="zap_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#zapreach_bg)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Outer Broadcast Wave (Reach) -->
  <path d="M43 19C48.5 22.5 52 27 52 32C52 37 48.5 41.5 43 45" stroke="url(#zapreach_wave)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M39 23.5C42.8 26 45 28.8 45 32C45 35.2 42.8 38 39 40.5" stroke="url(#zapreach_wave)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.95"/>

  <!-- Electric Bolt (Zap) with Glow -->
  <path d="M31 11L15 34H28L25 53L43 28H29L31 11Z" fill="url(#zapreach_bolt)" filter="url(#zap_glow)"/>
</svg>
